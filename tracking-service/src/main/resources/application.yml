server:
  port: 8084

spring:
  application:
    name: tracking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shiptrack_tracking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: shiptrack_tracking
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    schemas: shiptrack_tracking
    locations: classpath:db/migration

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shiptrackpro.tracking: DEBUG
