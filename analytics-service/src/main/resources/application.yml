server:
  port: 8086

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shiptrack_analytics
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: shiptrack_analytics
    open-in-view: false

  flyway:
    enabled: true
    schemas: shiptrack_analytics
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

# Internal service URLs
services:
  shipment-service-url: http://localhost:8083
  tracking-service-url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shiptrackpro.analytics: DEBUG
