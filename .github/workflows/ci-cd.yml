name: ShipTrack Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # JOB 1: BACKEND BUILD & TEST
  # ==========================================
  backend-build-test:
    name: Build & Test Java Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Microservices with Maven
        run: |
          mvn -B clean test package --file pom.xml

  # ==========================================
  # JOB 2: FRONTEND BUILD & LINT
  # ==========================================
  frontend-build-test:
    name: Build & Lint React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

  # ==========================================
  # JOB 3: DOCKER IMAGE BUILD & PUBLISH
  # ==========================================
  docker-build:
    name: Build Docker Container Images
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Microservices Containers
        run: |
          echo "Building microservice Docker images..."
          docker build -t shiptrack/api-gateway:latest ./api-gateway
          docker build -t shiptrack/user-service:latest ./user-service
          docker build -t shiptrack/shipment-service:latest ./shipment-service
          docker build -t shiptrack/driver-service:latest ./driver-service
          docker build -t shiptrack/tracking-service:latest ./tracking-service
          docker build -t shiptrack/notification-service:latest ./notification-service
          docker build -t shiptrack/analytics-service:latest ./analytics-service
          docker build -t shiptrack/frontend:latest ./frontend
