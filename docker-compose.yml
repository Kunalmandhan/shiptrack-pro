services:
  # ==========================================
  # INFRASTRUCTURE CONTAINERS
  # ==========================================

  postgres:
    image: postgres:16-alpine
    container_name: shiptrack-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiptrack-net

  redis:
    image: redis:7-alpine
    container_name: shiptrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiptrack-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: shiptrack-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - shiptrack-net

  # ==========================================
  # APPLICATION MICROSERVICES
  # ==========================================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: shiptrack-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shiptrack-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: shiptrack-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_auth
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiptrack-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: shiptrack-user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_user
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shiptrack-net

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    container_name: shiptrack-shipment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_shipment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shiptrack-net

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    container_name: shiptrack-tracking-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_tracking
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiptrack-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: shiptrack-notification-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_notification
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shiptrack-net

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: shiptrack-analytics-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shiptrack_analytics
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiptrack-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiptrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - shiptrack-net

volumes:
  postgres_data:
  redis_data:

networks:
  shiptrack-net:
    driver: bridge
