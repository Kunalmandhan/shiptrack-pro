server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Route definitions — each service gets a route
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**


        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

        # SECURITY: Internal endpoints (/internal/**) are NOT routed through the gateway.
        # Services call each other directly within the Docker network.


        - id: shipment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/shipments/**, /api/v1/pod/**, /api/v1/drivers/**, /api/v1/vehicles/**

        - id: tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/tracking/**

        - id: tracking-websocket
          uri: ws://localhost:8084
          predicates:
            - Path=/ws/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**

        - id: analytics-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/analytics/**

  data:
    redis:
      host: localhost
      port: 6379

# JWT configuration (public key only — gateway verifies, never signs)
jwt:
  public-key-path: classpath:keys/public.pem

# Rate limiting
rate-limit:
  requests-per-minute: 100

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.shiptrackpro.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
