spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**

        - id: shipment-service
          uri: http://shipment-service:8083
          predicates:
            - Path=/api/v1/shipments/**, /api/v1/pod/**, /api/v1/drivers/**, /api/v1/vehicles/**

        - id: tracking-service
          uri: http://tracking-service:8084
          predicates:
            - Path=/api/v1/tracking/**

        - id: tracking-websocket
          uri: ws://tracking-service:8084
          predicates:
            - Path=/ws/**

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**

        - id: analytics-service
          uri: http://analytics-service:8086
          predicates:
            - Path=/api/v1/analytics/**

  data:
    redis:
      host: redis
