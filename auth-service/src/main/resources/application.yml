server:
  port: 8081

spring:
  application:
    name: auth-service

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/shiptrack_auth
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: shiptrack_auth
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    schemas: shiptrack_auth
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Mail (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/google"

# JWT Configuration
jwt:
  private-key-path: classpath:keys/private.pem
  public-key-path: classpath:keys/public.pem
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

# Internal service URLs
services:
  user-service-url: http://localhost:8082

# Application
app:
  frontend-url: http://localhost:3000
  email-verification-expiry-hours: 24
  password-reset-expiry-minutes: 60
  max-login-attempts: 5
  login-lock-duration-minutes: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shiptrackpro.auth: DEBUG
